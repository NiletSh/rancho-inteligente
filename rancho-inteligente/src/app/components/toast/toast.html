<!-- Contenedor de toasts en esquina superior derecha -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast show align-items-center text-white {{ getColor(toast.tipo) }} border-0 mb-2" role="alert">
      <div class="d-flex">
        <div class="toast-body">
          <i class="fa-solid {{ getIcon(toast.tipo) }} me-2"></i>
          {{ toast.mensaje }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="toastService.eliminar(toast.id)"></button>
      </div>
    </div>
  }
</div>
